<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="batik" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Kawung Pattern -->
      <circle cx="50" cy="50" r="20" fill="none" stroke="#8B7355" stroke-width="2" opacity="0.6"/>
      <circle cx="50" cy="50" r="15" fill="none" stroke="#8B7355" stroke-width="1.5" opacity="0.4"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#8B7355" stroke-width="2" opacity="0.6"/>
      <circle cx="100" cy="0" r="20" fill="none" stroke="#8B7355" stroke-width="2" opacity="0.6"/>
      <circle cx="0" cy="100" r="20" fill="none" stroke="#8B7355" stroke-width="2" opacity="0.6"/>
      <circle cx="100" cy="100" r="20" fill="none" stroke="#8B7355" stroke-width="2" opacity="0.6"/>
      
      <!-- Isen-isen -->
      <line x1="30" y1="30" x2="35" y2="35" stroke="#C9A961" stroke-width="0.5" opacity="0.3"/>
      <line x1="65" y1="30" x2="70" y2="35" stroke="#C9A961" stroke-width="0.5" opacity="0.3"/>
      <line x1="30" y1="65" x2="35" y2="70" stroke="#C9A961" stroke-width="0.5" opacity="0.3"/>
      <line x1="65" y1="65" x2="70" y2="70" stroke="#C9A961" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#batik)"/>
</svg>

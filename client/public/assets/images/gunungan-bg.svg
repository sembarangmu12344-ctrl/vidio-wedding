<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gunungan/Wayang Background SVG -->
  <defs>
    <linearGradient id="gunungGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C9B8A8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B7355;stop-opacity:1" />
    </linearGradient>
    <pattern id="batikPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#6B5D52" opacity="0.3"/>
      <circle cx="0" cy="0" r="2" fill="#6B5D52" opacity="0.3"/>
      <circle cx="40" cy="0" r="2" fill="#6B5D52" opacity="0.3"/>
      <circle cx="0" cy="40" r="2" fill="#6B5D52" opacity="0.3"/>
      <circle cx="40" cy="40" r="2" fill="#6B5D52" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Gunungan Shape -->
  <path d="M400 50 L700 950 Q400 850 100 950 Z" fill="url(#gunungGrad)" opacity="0.9"/>
  <path d="M400 100 L650 900 Q400 820 150 900 Z" fill="#D4C5B9" opacity="0.7"/>
  <path d="M400 150 L600 850 Q400 790 200 850 Z" fill="url(#batikPattern)"/>
  
  <!-- Ornamen -->
  <circle cx="400" cy="400" r="80" fill="none" stroke="#C9A961" stroke-width="3" opacity="0.5"/>
  <circle cx="400" cy="400" r="60" fill="none" stroke="#C9A961" stroke-width="2" opacity="0.5"/>
  
  <!-- Daun/Flora Pattern -->
  <g opacity="0.4">
    <ellipse cx="300" cy="300" rx="30" ry="50" fill="#6B5D52" transform="rotate(-45 300 300)"/>
    <ellipse cx="500" cy="300" rx="30" ry="50" fill="#6B5D52" transform="rotate(45 500 300)"/>
    <ellipse cx="250" cy="500" rx="25" ry="45" fill="#6B5D52" transform="rotate(-30 250 500)"/>
    <ellipse cx="550" cy="500" rx="25" ry="45" fill="#6B5D52" transform="rotate(30 550 500)"/>
  </g>
</svg>
